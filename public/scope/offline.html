<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transients</title>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: #6d757f;
    --line: #1b1e24;
    --edge: #262b33;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  .bar {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 6px 10px;
    flex: 0 0 auto;
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .bar::-webkit-scrollbar { display: none; }
  .bar.top { border-bottom: 1px solid var(--line); }
  .bar.bottom { border-top: 1px solid var(--line); }
  .spacer { flex: 1 1 auto; }
  .dim { color: var(--dim); }
  label { display: flex; align-items: center; gap: 6px; color: var(--dim); letter-spacing: .09em; }
  label b { font-weight: 400; }
  button {
    font: inherit;
    letter-spacing: .09em;
    color: var(--dim);
    background: transparent;
    border: 1px solid var(--edge);
    padding: 2px 8px;
    cursor: pointer;
  }
  button:hover { color: var(--fg); }
  button:disabled { opacity: .35; cursor: default; }
  button.on { color: var(--fg); border-color: var(--fg); }
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    width: 92px;
    height: 12px;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--edge); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 3px; height: 11px;
    background: var(--fg);
    margin-top: -5px;
  }
  input[type=range]::-moz-range-track { height: 1px; background: var(--edge); }
  input[type=range]::-moz-range-thumb { width: 3px; height: 11px; border: 0; border-radius: 0; background: var(--fg); }
  .val { color: var(--fg); min-width: 42px; display: inline-block; }
  #overWrap { flex: 0 0 72px; position: relative; min-height: 0; overflow: hidden; }
  #detailWrap { flex: 1 1 auto; position: relative; min-height: 0; overflow: hidden; border-top: 1px solid var(--line); }
  canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  #over { cursor: text; }
  #detail { cursor: crosshair; }
  #status, #time, #counts, #finfo { color: var(--dim); letter-spacing: .06em; }
  .grp { display: flex; align-items: center; gap: 6px; }
  #lamps { display: flex; gap: 3px; }
  #lamps span {
    display: inline-block; min-width: 34px; padding: 0 4px; text-align: center;
    border: 1px solid var(--edge); color: var(--dim); letter-spacing: .06em;
  }
  #status i, #time i, #counts i, #finfo i { color: var(--fg); font-style: normal; }
  #fname { max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
  #drop {
    position: absolute; inset: 0;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.85);
    border: 1px solid var(--fg);
    letter-spacing: .12em;
  }
  body.dragging #drop { display: flex; }
  #hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); letter-spacing: .12em; }
  body.has-file #hint { display: none; }
</style>
</head>
<body>

<div class="bar top">
  <button id="open">OPEN</button>
  <input id="file" type="file" accept="audio/*" hidden>
  <span id="fname" class="dim">no file</span>
  <span id="finfo"></span>
  <span class="spacer"></span>
  <span class="grp" id="engine" title="onset detector: madmom's CNN, or SuperFlux">
    <button data-engine="cnn">CNN</button>
    <button data-engine="sflux">SFLUX</button>
  </span>
  <span id="status"></span>
</div>

<div id="overWrap"><canvas id="over"></canvas></div>
<div id="detailWrap">
  <canvas id="detail"></canvas>
  <div id="hint">drop an audio file, or OPEN</div>
  <div id="drop">drop to analyse</div>
</div>

<div class="bar bottom">
  <label><b>SENS</b><input id="sens" type="range" min="0" max="1" step="0.01"><span class="val" id="sensv"></span></label>
  <label><b>WIN</b><input id="win" type="range" min="0" max="1000" step="1"><span class="val" id="winv"></span></label>
  <button id="play">PLAY</button>
  <span id="time"></span>
  <span id="lamps" title="what is playing at the playhead"></span>
  <span class="spacer"></span>
  <span id="counts"></span>
  <button id="export">EXPORT</button>
</div>

<script src="/scope/dsp.js"></script>
<script src="/scope/onsetcnn.js"></script>
<script src="/scope/offline.js"></script>
<script src="/scope/offline-app.js"></script>
</body>
</html>
